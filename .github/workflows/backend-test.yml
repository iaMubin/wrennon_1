name: Backend Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint (ruff)
      run: ruff check app tests scripts evals

    - name: Dependency audit (no ignores)
      # Fails the build on ANY known vulnerability in production dependencies.
      # If a finding is a verified false positive, add a single --ignore-vuln
      # here WITH a comment explaining why and an expiry date.
      run: pip-audit -r requirements.txt --progress-spinner off

    - name: Static analysis (bandit)
      run: bandit -q -r app/

    - name: Static mirror in sync with frontend/
      working-directory: .
      run: python scripts/sync_static.py --check

    - name: Run Pytest
      env:
        # Dummy values so Settings doesn't crash during initialization
        GROQ_API_KEY: "dummy"
        COHERE_API_KEY: "dummy"
        PINECONE_API_KEY: "dummy"
        PINECONE_HOST: "dummy"
        DATABASE_URL: "sqlite:///./test.db"
        REDIS_URL: "redis://localhost:6379"
        JWT_SECRET_KEY: "test-secret"
        AGENT_PASSWORD_HASH: "test-hash"
        AGENT_USERNAME: "test_admin"
        PYTHONPATH: "."
      run: |
        alembic upgrade head
        pytest tests/ --cov=app --cov-fail-under=47

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build production image (no push)
      run: docker build ./backend
