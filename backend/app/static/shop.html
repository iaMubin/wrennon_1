<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Northbound Goods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/agent/theme.css?v=65">
<link rel="stylesheet" href="widget.css?v=95">
<link rel="stylesheet" href="ui-polish.css?v=1">
<link rel="stylesheet" href="storefront.css?v=138423">

</head>
<body data-page="shop">
  <div class="sf" id="sf-root"></div>

  <!-- Chat widget -->
  <div id="wrennon-widget">
    <button id="launcher" aria-label="Open support chat" aria-expanded="false" aria-controls="panel">
      <svg class="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div id="panel" class="chat-card hidden" role="dialog" aria-label="Northbound Goods support chat" aria-modal="false" aria-hidden="true">
      <header id="panel-header" class="chat-card-head">
        <div class="chat-head-top">
          <span class="chat-logo" role="img" aria-label="Northbound Goods">
            <svg viewBox="0 0 36 36" aria-hidden="true" focusable="false"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M18 6.5L22.6 18H18Z" fill="currentColor"/><path d="M18 29.5L13.4 18H18Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M18 6.5L13.4 18H18Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            <span class="chat-logo__txt"><span class="chat-logo__word">Northbound</span><span class="chat-logo__sub">Goods</span></span>
          </span>
          <div class="chat-head-actions">
            <div class="chat-menu-wrap">
              <button class="chat-icon-btn widget-menu-btn" aria-label="Widget appearance & theme" aria-expanded="false" aria-haspopup="true" title="Theme options">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <circle cx="12" cy="5" r="1.75"/>
                  <circle cx="12" cy="12" r="1.75"/>
                  <circle cx="12" cy="19" r="1.75"/>
                </svg>
              </button>
              <div class="chat-menu-dropdown hidden" role="menu" aria-label="Theme settings">
                <div class="chat-menu-heading">Theme</div>
                <button type="button" class="chat-menu-item" data-theme-choice="system" role="menuitemradio">
                  <span class="chat-menu-item__icon">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                      <line x1="8" y1="21" x2="16" y2="21"/>
                      <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                  </span>
                  <span class="chat-menu-item__label">System Auto</span>
                  <span class="chat-menu-item__check">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </span>
                </button>
                <button type="button" class="chat-menu-item" data-theme-choice="light" role="menuitemradio">
                  <span class="chat-menu-item__icon">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="5"/>
                      <line x1="12" y1="1" x2="12" y2="3"/>
                      <line x1="12" y1="21" x2="12" y2="23"/>
                      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                      <line x1="1" y1="12" x2="3" y2="12"/>
                      <line x1="21" y1="12" x2="23" y2="12"/>
                      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                  </span>
                  <span class="chat-menu-item__label">Light</span>
                  <span class="chat-menu-item__check">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </span>
                </button>
                <button type="button" class="chat-menu-item" data-theme-choice="dark" role="menuitemradio">
                  <span class="chat-menu-item__icon">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                  </span>
                  <span class="chat-menu-item__label">Dark</span>
                  <span class="chat-menu-item__check">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </span>
                </button>
              </div>
            </div>
            <a class="chat-icon-btn" href="/help-center.html" target="_blank" rel="noopener" aria-label="Search our Help Center" title="Help Center">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </a>
            <button id="close-btn" class="chat-icon-btn" aria-label="Minimize chat" title="Minimize">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
        </div>
        <div class="chat-hero">
          <div class="chat-hero__inner">
            <h2 class="chat-hero__title">Hi, how can we help?</h2>
            <p class="chat-hero__text">Ask about an order, a return or the right fit. We answer right away, and a teammate steps in whenever you need one.</p>
            <div class="chat-status"><span class="status-dot"></span>Support online &middot; replies in seconds</div>
          </div>
        </div>
      </header>
      
      <header id="panel-header-crisp" class="chat-card-head crisp-head" style="display: none;">
        <div class="crisp-tabs">
          <button class="crisp-tab active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10a9.96 9.96 0 0 1-4.783-1.218L2.5 22.5l1.718-4.717A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2zm0 2a8 8 0 0 0-8 8c0 1.554.444 3.003 1.206 4.24l.197.315-.815 2.235 2.235-.815.315.197A7.96 7.96 0 0 0 12 20a8 8 0 0 0 8-8 8 8 0 0 0-8-8z"></path></svg> Chat
          </button>
          <button class="crisp-tab">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> Helpdesk
          </button>
        </div>
        <div class="crisp-profile">
          <div class="crisp-avatar-wrap">
            <img src="/agent/images/wren-mark.svg" alt="Agent" style="filter: invert(1); width: 28px;">
            <div class="crisp-status-dot"></div>
          </div>
          <div class="crisp-name">Beth from Crisp</div>
          <button class="crisp-connect-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.145 2 11.259c0 2.91 1.505 5.511 3.82 7.202v3.743c0 .356.386.574.697.4l3.523-1.956c1.196.34 2.476.516 3.793.516 5.523 0 10-4.145 10-9.259S17.523 2 12 2zm1.096 12.399l-2.617-2.793-5.074 2.793 5.59-5.918 2.65 2.793 5.04-2.793-5.59 5.918z"></path></svg> Connect on other platforms
          </button>
        </div>
      </header>

      <div id="messages" class="chat-body" aria-live="polite" aria-relevant="additions text">
        <div class="chat-intro">
          <div class="chat-suggestions__label">Popular questions</div>
          <div class="chat-suggestions" role="group" aria-label="Suggested questions">
          <button type="button" class="chat-suggestion" data-message="Where is my order?">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <span>Track my order</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button type="button" class="chat-suggestion" data-message="I'd like to start a return">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span>Start a return or exchange</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button type="button" class="chat-suggestion" data-message="Help me find the right size">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg>
            <span>Find the right size</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button type="button" class="chat-suggestion" data-message="I'd like to talk to a person">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Talk to a person</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          </div>
        </div>
      </div>

      <div id="input-row" class="chat-input">
        <input type="file" id="photo-upload" style="display: none;" accept="image/*" />
        <input type="file" id="voice-upload" style="display: none;" accept="audio/*" capture="user" />
        
        <div class="chat-input-icons">
          <button id="photo-btn" aria-label="Send a photo" title="Send a photo" class="chat-icon-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="5" ry="5"/>
              <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
              <path d="m21 15-5-5a2 2 0 0 0-2.8 0L5 18"/>
            </svg>
          </button>
          <button id="voice-btn" aria-label="Record voice message" title="Record voice message" class="chat-icon-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </button>
        </div>

        <textarea id="message-input" class="chat-input-placeholder" placeholder="Type a message..." aria-label="Type your message" rows="1"></textarea>
        
        <button id="send-btn" aria-label="Send message" class="chat-send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m22 2-7 20-4-9-9-4Z"/>
            <path d="M22 2 11 13"/>
          </svg>
        </button>
      </div>

      <div class="chat-powered">Powered by <a href="https://wrennon.com" target="_blank" rel="noopener">WRENNON</a></div>
    </div>
  </div>

  <script src="/widget.js?v=89"></script>
<script src="products.js?v=775f40"></script>
<script src="storefront.js?v=775f40"></script>
</body>
</html>
