<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storefront — Wrennon Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/agent/theme.css?v=65">
<link rel="stylesheet" href="widget.css?v=66">
</head>
<body>
  <!-- Placeholder storefront background so the widget has real context to sit on -->
  <main class="storefront-mock">
    <header class="storefront-mock__nav">
      <span class="storefront-mock__logo">Northbound Goods</span>
    </header>
    <section class="storefront-mock__hero">
      <h1>Field jackets, built for weather that doesn't cooperate.</h1>
      <p>This page is a placeholder backdrop — the actual deliverable is the chat widget in the corner.</p>
    </section>
  </main>

  <!-- Chat widget -->
  <div id="wrennon-widget">
    <button id="launcher" aria-label="Open support chat">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </button>

    <div id="panel" class="chat-card hidden">
      <header id="panel-header" class="chat-card-head">
        <span class="chat-avatar"><img src="https://wrennon.com/images/wren-mark.svg" alt="Wrennon" width="18" height="18" aria-hidden="true"></span>
        <div style="flex: 1;">
          <div class="chat-name">Wrennon Agent</div>
          <div class="chat-status"><span class="status-dot"></span>Online &mdash; replies in seconds</div>
        </div>
        <button id="close-btn" class="chat-icon-btn" style="border: none; background: transparent; cursor: pointer; padding: 4px;" aria-label="Close chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </header>

      <div id="messages" class="chat-body" aria-live="polite"></div>

      <div id="input-row" class="chat-input">
        <input type="file" id="photo-upload" style="display: none;" accept="image/*" />
        <input type="file" id="voice-upload" style="display: none;" accept="audio/*" capture="user" />
        
        <div class="chat-input-icons">
          <button id="photo-btn" aria-label="Send a photo" title="Send a photo" class="chat-icon-btn" style="background: none; border: none; cursor: pointer;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          </button>
          <button id="voice-btn" aria-label="Record voice message" title="Record voice message" class="chat-icon-btn" style="background: none; border: none; cursor: pointer;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
        </div>

        <textarea id="message-input" class="chat-input-placeholder" placeholder="Type a message..." style="background: transparent; border: none; outline: none; resize: none; min-height: 20px; height: 20px; padding: 0; margin: 0; line-height: 20px; color: inherit; font-family: inherit; font-size: inherit;" rows="1"></textarea>
        
        <button id="send-btn" aria-label="Send message" class="chat-send" style="background: none; border: none; cursor: pointer;">
          &#10148;
        </button>
      </div>
    </div>
  </div>

  <script src="/widget.js?v=66"></script>
</body>
</html>
